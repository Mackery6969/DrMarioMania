version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The Godot SDK version has to match the editor, so update it alongside Godot instead.
      - dependency-name: Godot.NET.Sdk
