
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            preset: DrMarioMania
            output: build/Windows/DrMarioMania.exe
            artifact: DrMarioMania-Windows
          - platform: Linux
            os: ubuntu-latest
            preset: DrMarioMania
            output: build/Linux/DrMarioMania.x86_64
            artifact: DrMarioMania-Linux
          - platform: macOS
            os: macos-latest
            preset: macOS
            output: build/macOS/DrMarioMania.zip
            artifact: DrMarioMania-macOS
          - platform: Android
            os: ubuntu-latest
            preset: DrMarioMania
            output: build/Android/DrMarioMania.apk
            artifact: DrMarioMania-Android

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Setup Godot .NET and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true

      - name: Verify Godot
        run: godot --headless --version

      - name: Restore C# project
        run: dotnet restore DrMario.csproj

      - name: Build C# project
        run: dotnet build DrMario.csproj --configuration Release --no-restore

      - name: Import resources
        run: godot --headless --editor --path . --import

      - name: Create output directory
        shell: bash
        run: mkdir -p "$(dirname "${{ matrix.output }}")"

      - name: Export release
        run: godot --headless --path . --export-release "${{ matrix.preset }}" "${{ matrix.output }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
