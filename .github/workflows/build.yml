name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            preset: Windows
            output: build/Windows/DrMarioMania.exe

          - platform: Linux
            os: ubuntu-latest
            preset: Linux
            output: build/Linux/DrMarioMania.x86_64

          - platform: Android
            os: ubuntu-latest
            preset: Android
            output: build/Android/DrMarioMania.apk
            export-args: --install-android-build-template

          - platform: macOS
            os: macos-latest
            preset: macOS
            output: build/macOS/DrMarioMania.zip

          - platform: iOS
            os: macos-latest
            preset: iOS
            output: build/iOS/DrMarioMania.ipa

    defaults:
      run:
        # Godot's Windows executable is a GUI app, so PowerShell doesn't wait for it to exit.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Setup Java
        if: matrix.platform == 'Android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        if: matrix.platform == 'Android'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.1.0

      - name: Setup Godot .NET and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true

      - name: Verify Godot
        run: godot --headless --version

      - name: Restore C# project
        run: dotnet restore DrMario.csproj

      # The editor loads the Debug assembly; the export step does its own Release publish.
      - name: Build C# project
        run: dotnet build DrMario.csproj --no-restore

      - name: Import resources
        run: godot --headless --editor --path . --import

      - name: Prepare Android release keystore
        if: matrix.platform == 'Android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            user="$KEYSTORE_USER"
            password="$KEYSTORE_PASSWORD"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set, signing the APK with a throwaway keystore."
            user=ci
            password="$(openssl rand -hex 16)"
            keytool -genkeypair -noprompt -keystore "$keystore" -alias "$user" \
              -storepass "$password" -keypass "$password" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=DrMarioMania CI"
          fi
          echo "::add-mask::$password"
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$user"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      # Building a signed .ipa needs certificates and provisioning profiles, so CI only exports the Xcode project.
      - name: Configure iOS export
        if: matrix.platform == 'iOS'
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "::notice::APPLE_TEAM_ID variable not set, using a placeholder team ID in the Xcode project."
            APPLE_TEAM_ID=XXXXXXXXXX
          fi
          sed -i '' \
            -e "s/^application\/app_store_team_id=.*/application\/app_store_team_id=\"$APPLE_TEAM_ID\"/" \
            -e "s/^application\/export_project_only=.*/application\/export_project_only=true/" \
            export_presets.cfg

      - name: Export release
        run: |
          mkdir -p "$(dirname "${{ matrix.output }}")"
          godot --headless --path . --export-release "${{ matrix.preset }}" "${{ matrix.output }}" ${{ matrix.export-args }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: DrMarioMania-${{ matrix.platform }}
          path: build/${{ matrix.platform }}/
          if-no-files-found: error
